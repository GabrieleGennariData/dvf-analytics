version: 2

# Tests generiques des modeles de models/intermediate/.
#
# SYNTAXE : `data_tests:` (pas `tests:`) et parametres sous `arguments:`. La
# forme classique est FATALE sur Fusion 2.0 (dbt1159, exit 1), pas depreciee.
#
# STATUT DE CHAQUE TEST : VERIFIE (peut echouer sur une regression reelle),
# DOCUMENTE (tautologique) ou GARDE-FOU (surveille une regression en amont).
#
# Chiffres mesures sur la livraison DVF+ 2026.1, 2014-2025.

models:

  # ---------------------------------------------------------------------------
  - name: int_dvfplus__mutations
    description: |
      Mutations VALIDES au grain mutation, avant tout filtre de nature. Modele
      INTERNE : les consommateurs lisent fct_mutations. C'est ici que les
      colonnes DVF+ deviennent le vocabulaire canonique, que prix_m2 se calcule
      et que les deux drapeaux de population se posent ; en aval tout cela se
      transporte.

      PARTITION : les 16 565 022 mutations se repartissent entre ce modele
      (16 527 605) et int_dvfplus__mutations_rejected (37 417, soit 0,226 %). La
      regle est ecrite en un seul point et assert_partition_rejetees la prouve a
      chaque build.

      Ce modele porte encore les six natures de mutation, contrairement a fct :
      c'est pour cela que l'accepted_values sur les natures vit ici.
    columns:

      - name: mutation_sk
        description: |
          Hash de id_mutation. L'unicite est une propriete MESUREE de la
          livraison, pas une garantie du Cerema : le test qui la surveille doit
          vivre ici.
        data_tests:
          # VERIFIE. Une edition qui livrerait une mutation dans deux fichiers
          # departementaux casserait le grain, et ce test le verrait en premier.
          - unique
          # VERIFIE - DuckDB n'applique pas NOT NULL aux colonnes d'un CTAS.
          - not_null

      - name: nature_mutation
        description: |
          Nature de la transaction. Comptages mesures, aucun NULL :

          - Vente                               15 187 998
          - Vente en l'etat futur d'achevement    1 099 309
          - Echange                                118 418
          - Vente terrain a batir                   68 774
          - Adjudication                            52 117
          - Expropriation                              989

          PIEGE : trois natures sur six commencent par "Vente". Un
          `like 'Vente%'` ferait entrer la VEFA et le terrain a batir sans
          produire aucune valeur hors bornes, donc sans aucun test rouge. Le
          filtre correct est `= 'Vente'` EXACT. libnatmut etant scalaire, aucune
          mutation ne porte deux natures.
        data_tests:
          # VERIFIE. ATTENTION, L'APOSTROPHE EST DOUBLE ('') : accepted_values
          # interpole les valeurs dans le SQL sans echapper les apostrophes, et
          # avec une apostrophe simple le compiled est du SQL casse (dbt1308),
          # avec une erreur qui pointe vers l'accent. Guillemets doubles YAML
          # obligatoires, sinon '' serait l'echappement YAML et annulerait celui
          # du SQL. A revoir si un dbt futur ajoute l'echappement.
          - accepted_values:
              arguments:
                values:
                  - "Vente"
                  - "Vente en l''état futur d''achèvement"
                  - "Echange"
                  - "Vente terrain à bâtir"
                  - "Adjudication"
                  - "Expropriation"

      - name: type_local
        description: |
          Vocabulaire canonique : 'Maison' pour codtypbien 111, 'Appartement'
          pour 121, NULL pour tout le reste.

          PIEGE : NULL n'est pas "type inconnu" ni une categorie, c'est "hors
          perimetre mono-logement". La cause precise se lit dans codtypbien.
        data_tests:
          # DOCUMENTE - le CASE du modele n'a que deux branches, et
          # accepted_values ne voit pas les NULL. Ici on documente le contrat de
          # la colonne pour l'aval.
          - accepted_values:
              arguments:
                values:
                  - "Maison"
                  - "Appartement"

  # ---------------------------------------------------------------------------
  - name: int_dvfplus__mutations_rejected
    description: |
      Mutations REJETEES avec le motif du rejet, 37 417 lignes. Modele interne
      et diagnostique, cul-de-sac declare : rien n'en lit. Il existe pour qu'un
      rejet soit INTERROGEABLE au lieu d'etre seulement absent, donc
      indistinguable d'une donnee manquante a la source.
    columns:

      - name: reject_reason
        description: |
          Deux motifs declares : `valeur_fonciere_nulle` (32 129 lignes) et
          `valeur_fonciere_non_positive` (5 288).

          Le second est reste a zero ligne tant que le projet n'analysait que
          2021-2025 ; l'ouverture aux annees 2014-2020 l'a peuple sans qu'une
          ligne de code change. Une branche se declare meme vide.

          DEUX TESTS ET PAS UN : le CASE n'a pas de branche else.
          accepted_values liste les valeurs admises mais ne voit pas le NULL ;
          not_null voit le NULL sans regarder les valeurs. Ensemble ils couvrent
          le cas qui compte, une regle de rejet elargie sans `when`
          correspondant, qui produirait des rejets sans motif.
        data_tests:
          # VERIFIE - surveille l'apparition d'un troisieme motif non declare.
          - accepted_values:
              arguments:
                values:
                  - "valeur_fonciere_nulle"
                  - "valeur_fonciere_non_positive"
          # VERIFIE - ferme le trou de l'accepted_values ci-dessus (les NULL).
          - not_null
